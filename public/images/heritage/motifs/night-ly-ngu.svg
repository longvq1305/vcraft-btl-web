<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" fill="none">
      <defs>
        <radialGradient id="waterMoonGlow" cx="50%" cy="48%" r="45%">
          <stop offset="0%" stop-color="#EFF3EE" stop-opacity="0.82"/>
          <stop offset="38%" stop-color="#86DBC4" stop-opacity="0.38"/>
          <stop offset="75%" stop-color="#165950" stop-opacity="0.14"/>
          <stop offset="100%" stop-color="#0B1520" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- Shimmering Moon Reflection in Water ("Bóng Trăng Đáy Nước") -->
      <ellipse cx="320" cy="205" rx="165" ry="72" fill="url(#waterMoonGlow)"/>
      <ellipse cx="320" cy="196" rx="58" ry="44" fill="#EFF3EE" fill-opacity="0.72" stroke="#86DBC4" stroke-width="1.4"/>
      <path d="M276,198 Q320,206 364,198 M286,210 Q320,217 354,210 M298,222 Q320,226 342,222" stroke="#0B1520" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>

      <!-- Concentric water ripples -->
      <ellipse cx="320" cy="215" rx="78" ry="22" stroke="#EFF3EE" stroke-width="1.4" stroke-dasharray="28 10 16 8" opacity="0.78"/><ellipse cx="320" cy="215" rx="108" ry="30" stroke="#86DBC4" stroke-width="1.4" stroke-dasharray="28 10 16 8" opacity="0.68"/><ellipse cx="320" cy="215" rx="145" ry="40" stroke="#86DBC4" stroke-width="1.4" stroke-dasharray="28 10 16 8" opacity="0.52"/><ellipse cx="320" cy="215" rx="188" ry="52" stroke="#E0B658" stroke-width="1.4" stroke-dasharray="28 10 16 8" opacity="0.42"/><ellipse cx="320" cy="215" rx="236" ry="65" stroke="#165950" stroke-width="1.4" stroke-dasharray="28 10 16 8" opacity="0.65"/><ellipse cx="320" cy="215" rx="285" ry="78" stroke="#86DBC4" stroke-width="1.4" stroke-dasharray="28 10 16 8" opacity="0.28"/>

      <!-- Horizontal shimmering water lines -->
      <path d="M120,152 L225,152 M415,152 L525,152 M85,255 L178,255 M465,258 L560,258" stroke="#86DBC4" stroke-width="1.1" stroke-linecap="round" opacity="0.45"/>

      <!-- Pair of Lý Ngư Carp gazing toward the Moon Reflection -->
      
    <g transform="translate(175,286) rotate(32) scale(0.96, 0.96)">
